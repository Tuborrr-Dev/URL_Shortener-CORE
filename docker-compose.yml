services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dbname
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/dbname
      POOL_MODE: transaction
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256 
      MAX_CLIENT_CONN: "2000"     
      DEFAULT_POOL_SIZE: "75"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "user"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6432:6432"

  web:
    build: .
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis: 
        condition: service_started
    command: sh -c "alembic upgrade head && gunicorn main:app -k uvicorn.workers.UvicornWorker --workers 8 --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@pgbouncer:6432/dbname
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    build: .
    command: celery -A services.background_tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:pass@pgbouncer:6432/dbname
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"